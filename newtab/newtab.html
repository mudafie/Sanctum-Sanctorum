<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Hello</h1>
            <p class="motivate"></p>
        </header>
        <main>
            <section id="chrono">
                <div id="clock"></div>
                <div id="date"></div>
            </section>
            
            <section>
                <div id="task-create">
                    <input type="text" id="item" placeholder="Enter to-do item.">
                    <button type="button" id="btn">Add to list</button>
                    <button type="button" id="filter">Filter</button>
                </div>
                <div id="list">
                    <ul id="todo"></ul>
                </div>
            </section>

            <section id="info">
                <div id="weather">
                    <input type="text" id="location">
                    <button type="button" id="place">Set location.</button>
                </div>
                <div id="news"></div>
            </section>
        </main>
    </body>
</html>

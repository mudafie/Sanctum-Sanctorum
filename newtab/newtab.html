<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Hello</h1>
            <p class="motivate"></p>
        </header>
        <main>
            <section id="chrono">
                <div id="clock"></div>
                <div id="date"></div>
            </section>
            
            <section>
                <div id="task-create">
                    <input type="text" id="item" placeholder="Enter to-do item.">
                    <button type="button" id="btn">Add to list</button>
                    <button type="button" id="filter">Filter</button>
                </div>
                <div id="list">
                    <ul id="todo"></ul>
                </div>
            </section>

            <section>
                <div id="timer-card">
                    <div id="timer">00:00</div>
                    <label for="work">Focus Time</label>
                    <input type="number" id="work" name="work" min="0" max="59" value="0">
                
                    <label for="break">Break</label>
                    <input type="number" id="break" name="break" min="0" max="59" value="0">

                    <button id="timerBtn">Start</button>
                    <button id="resetBtn">Reset</button>
                </div>
            </section>

            <section id="info">
                <div id="weather">
                    <input type="text" id="location">
                    <button type="button" id="place">Set location.</button>
                    <div id="weather-card">
                        <div id="weather-current"></div>
                        <div id="weather-daily"></div>
                        <div id="weather-hourly"></div>
                    </div>
                </div>
                <div id="notable">
                    <textarea id="notes" name="notes" rows="6" cols="75"></textarea>
                </div>
            </section>
        </main>
    </body>
</html>
